---
name: Test Migration
on:
  pull_request:
    paths:
      - .github/workflows/**/*
      - spec/**/*
      - lib/**/*
      - tasks/**/*
      - functions/**/*
      - types/**/*
      - plans/**/*
      - hiera/**/*
      - manifests/**/*
      - templates/**/*
      - files/**/*
      - metadata.json
      - Rakefile
      - Gemfile
      - provision.yaml
      - .rspec
      - .rubocop.yml
      - .puppet-lint.rc
      - .fixtures.yml
    branches: [main]
  workflow_dispatch:
    inputs:
      # TEMPORARY, validation only (CAT-2538): lets a manual run exercise just
      # the disk-resize diagnostic job below instead of the full migration
      # matrix. Remove this input and the diagnose-disk-resize job before merge.
      diagnose_only:
        description: 'Skip the migration matrix and only run the disk-resize diagnostic'
        type: boolean
        default: false
jobs:
  test-migration:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnose_only }}
    name: PE ${{ matrix.version }} ${{ matrix.architecture }} on ${{ matrix.image }}
      PE upgrade? ${{ matrix.new_pe_version }}
    runs-on: ubuntu-latest
    env:
      BOLT_GEM: true
      BOLT_DISABLE_ANALYTICS: true
      LANG: en_US.UTF-8
      # TEMPORARY, validation only (CAT-2538): provision_service#448 (the
      # disk_size_gb backend support) is only merged into its PR branch so
      # far, not main/release -- facade-release (the task's default) silently
      # ignores disk_size_gb since it predates that PR, which is why earlier
      # attempts saw the disk stay at its unchanged default size with no
      # error. Point at the PR's own test-deploy facade instead, created
      # automatically per docs/testing.md. Remove before merge.
      SERVICE_URL: https://facade-per-job-disk-size-1079112402178.europe-west1.run.app/v1/provision
      # PE 2026.0.0 jobs hit CI VM OOM (Cannot allocate memory - fork(2))
      # on the default provision_service VM size. Request a bigger VM via
      # provision#301 (provision >= v3.1.0), scoped to combinations that
      # install or upgrade to 2026.0.0 -- empty string for everything else
      # leaves the task's own default untouched (see provision_service.rb).
      PROVISION_MACHINE_TYPE: ${{ (matrix.version == '2026.0.0' || matrix.new_pe_version == '2026.0.0') && 'n2-standard-4' || '' }}
      # TEMPORARY, validation only (CAT-2538): standard/large/extra-large -> 2026.0.0
      # migrations run out of boot disk space extracting the PE 2026.0.0 tarball
      # (tar: ... No space left on device). Requests a bigger boot disk via
      # provision_service's new disk_size_gb support (provision#303, not yet
      # tagged -- this branch pins provision to the per-job-disk-size ref below
      # to pick it up). Do not merge this env var or the .fixtures.yml ref change;
      # revert both once the fix is confirmed and provision#303 is tagged.
      PROVISION_DISK_SIZE_GB: ${{ (matrix.version == '2026.0.0' || matrix.new_pe_version == '2026.0.0') && '100' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY, validation only (CAT-2538): trimmed to just the 3 combos
        # PEADM reported as disk-space failures, to avoid burning CI time/cost
        # on the full matrix while validating the disk_size_gb fix. Restore the
        # full architecture/version/exclude lists from main before merging.
        architecture:
          - standard
          - large
          - extra-large
        version: [2025.12.0]
        image: [almalinux-cloud/almalinux-8]
        include:
          - architecture: standard
            version: 2025.12.0
            image: almalinux-cloud/almalinux-8
            new_pe_version: 2026.0.0
          - architecture: large
            version: 2025.12.0
            image: almalinux-cloud/almalinux-8
            new_pe_version: 2026.0.0
          - architecture: extra-large
            version: 2025.12.0
            image: almalinux-cloud/almalinux-8
            new_pe_version: 2026.0.0
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Print bundle environment
        if: ${{ github.repository_owner == 'puppetlabs' }}
        run: |
          echo ::group::info:bundler
            bundle env
          echo ::endgroup::
      - name: Provision test cluster
        timeout-minutes: 15
        run: |
          echo ::group::prepare
            mkdir -p $HOME/.ssh
            echo 'Host *'                      >  $HOME/.ssh/config
            echo '    ServerAliveInterval 150' >> $HOME/.ssh/config
            echo '    ServerAliveCountMax 2'   >> $HOME/.ssh/config
            bundle exec rake spec_prep
          echo ::endgroup::
          echo ::group::provision
            bundle exec bolt plan run peadm_spec::provision_test_cluster \
              --modulepath spec/fixtures/modules \
              provider=provision_service \
              image=${{ matrix.image }} \
              architecture=${{ matrix.architecture }}-migration \
              --log-level trace
          echo ::endgroup::
          echo ::group::info:request
            cat request.json || true; echo
          echo ::endgroup::
          echo ::group::info:inventory
            sed -e 's/password: .*/password: "[redacted]"/' < spec/fixtures/litmus_inventory.yaml || true
          echo ::endgroup::
          echo ::group::certnames
            bundle exec bolt plan run peadm_spec::add_inventory_hostnames \
            --inventory spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            --no-host-key-check \
            inventory_file=spec/fixtures/litmus_inventory.yaml
          echo ::endgroup::
      - name: Output contents of litmus_inventory.yaml
        run: |
          cat spec/fixtures/litmus_inventory.yaml
      - name: Install PE on test cluster
        timeout-minutes: 120
        run: |
          bundle exec bolt plan run peadm_spec::install_test_cluster \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            architecture=${{ matrix.architecture }} \
            version=${{ matrix.version }} \
            console_password=${{ secrets.CONSOLE_PASSWORD }} \
            code_manager_auto_configure=true
      - name: Clean cache on PE nodes before upgrade
        timeout-minutes: 15
        run: |
          bundle exec bolt command run \
            'dnf clean all || yum clean all;
             rm -rf /var/cache/dnf/* /var/tmp/* /tmp/*;
             rm -rf /opt/puppetlabs/server/data/{packages/public,staging}/* || true' \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --targets all
      - name: Perform migration
        run: |
          echo ::group::prepare
            mkdir -p $HOME/.ssh
            echo 'Host *'                      >  $HOME/.ssh/config
            echo '    ServerAliveInterval 150' >> $HOME/.ssh/config
            echo '    ServerAliveCountMax 2'   >> $HOME/.ssh/config
            bundle exec rake spec_prep
          echo ::endgroup::
          bundle exec bolt plan run peadm_spec::test_migration \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            primary_host=$(yq -r '.groups[].targets[] | select(.vars.role == "primary") | .name // ""' spec/fixtures/litmus_inventory.yaml) \
            new_primary_host=$(yq -r '.groups[].targets[] | select(.vars.role == "new-primary") | .name // ""' spec/fixtures/litmus_inventory.yaml) \
            new_replica_host=$(yq -r '.groups[].targets[] | select(.vars.role == "new-replica") | .name // ""' spec/fixtures/litmus_inventory.yaml) \
            new_primary_postgresql_host=$(yq -r '.groups[].targets[] | select(.vars.role == "new-primary-pdb-postgresql") | .name // ""' spec/fixtures/litmus_inventory.yaml) \
            new_replica_postgresql_host=$(yq -r '.groups[].targets[] | select(.vars.role == "new-replica-pdb-postgresql") | .name // ""' spec/fixtures/litmus_inventory.yaml) \
            upgrade_version=${{ matrix.new_pe_version }} \
          --no-host-key-check
      - name: Tear down PE ${{ matrix.architecture }} test cluster
        if: ${{ always() }}
        continue-on-error: true
        run: |-
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            echo ::group::tear_down
              bundle exec rake 'litmus:tear_down'
            echo ::endgroup::
            echo ::group::info:request
              cat request.json || true; echo
            echo ::endgroup::
          fi

  # TEMPORARY, validation only (CAT-2538) -- not for merge. Provisions a
  # single VM with a requested disk_size_gb and inspects lsblk/df to confirm
  # the boot disk is actually created at the requested size. An earlier run
  # against facade-release (production) showed the disk silently staying at
  # its default 10G even with disk_size_gb set -- because #448 isn't merged
  # into main/release yet, so production doesn't know the field at all. Uses
  # the PR's own test-deploy facade (SERVICE_URL below) instead.
  diagnose-disk-resize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_only }}
    runs-on: ubuntu-latest
    env:
      BOLT_GEM: true
      BOLT_DISABLE_ANALYTICS: true
      LANG: en_US.UTF-8
      PROVISION_DISK_SIZE_GB: '100'
      # TEMPORARY, validation only (CAT-2538): see the comment on the
      # test-migration job's SERVICE_URL for why this points at the PR's own
      # test-deploy facade instead of the task's production default.
      SERVICE_URL: https://facade-per-job-disk-size-1079112402178.europe-west1.run.app/v1/provision
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Provision single test VM
        timeout-minutes: 10
        run: |
          bundle exec rake spec_prep
          bundle exec bolt task run provision::provision_service \
            --targets localhost \
            --modulepath spec/fixtures/modules \
            action=provision \
            platform=almalinux-cloud/almalinux-8 \
            disk_size_gb=100 \
            retry_attempts=1
      - name: Output contents of litmus_inventory.yaml
        run: |
          sed -e 's/password: .*/password: "[redacted]"/' < spec/fixtures/litmus_inventory.yaml
      - name: Wait for SSH to become available
        timeout-minutes: 5
        run: |
          until bundle exec bolt command run 'true' --inventoryfile spec/fixtures/litmus_inventory.yaml --targets all --no-host-key-check; do
            echo "SSH not ready yet, retrying in 10s..."
            sleep 10
          done
      - name: Inspect disk and filesystem size
        run: |
          bundle exec bolt command run '
            echo "--- lsblk ---"
            lsblk
            echo "--- df -h ---"
            df -h
            echo "--- growpart / cloud-utils presence ---"
            rpm -q cloud-utils-growpart google-compute-engine-guest-configs google-compute-engine 2>&1 || true
            echo "--- guest-agent / cloud-init logs (last 100 lines each) ---"
            journalctl -u google-guest-agent --no-pager 2>&1 | tail -100 || true
            journalctl -u google-startup-scripts --no-pager 2>&1 | tail -100 || true
            test -f /var/log/cloud-init.log && tail -100 /var/log/cloud-init.log || echo "no cloud-init.log"
          ' --inventoryfile spec/fixtures/litmus_inventory.yaml --targets all --no-host-key-check
      - name: Tear down test VM
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            bundle exec rake 'litmus:tear_down'
          fi
