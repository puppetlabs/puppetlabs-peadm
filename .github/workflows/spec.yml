---
name: Spec Tests
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/**/*
      - spec/**/*
      - lib/**/*
      - tasks/**/*
      - functions/**/*
      - types/**/*
      - plans/**/*
      - hiera/**/*
      - manifests/**/*
      - templates/**/*
      - files/**/*
      - metadata.json
      - Rakefile
      - Gemfile
      - provision.yaml
      - .rspec
      - .rubocop.yml
      - .puppet-lint.rc
      - .fixtures.yml
jobs:
  setup_matrix:
    name: Setup Test Matrix
    runs-on: ubuntu-latest
    outputs:
      spec_matrix: ${{ steps.get-matrix.outputs.spec_matrix }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        if: ${{ github.repository_owner == 'puppetlabs' }}
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        if: ${{ github.repository_owner == 'puppetlabs' }}
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Print bundle environment
        if: ${{ github.repository_owner == 'puppetlabs' }}
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::
      - name: Run Static & Syntax Tests
        if: ${{ github.repository_owner == 'puppetlabs' }}
        run: |
          bundle exec rake validate lint check rubocop
      - name: Setup Spec Test Matrix
        id: get-matrix
        run: |
          if [ '${{ github.repository_owner }}' == 'puppetlabs' ]; then
            bundle exec matrix_from_metadata_v2
          else
            echo  "::set-output name=spec_matrix::{}"
          fi
  Spec:
    name: 'Spec Tests (Puppet: ${{matrix.puppet_version}}, Ruby Ver: ${{matrix.ruby_version}})'
    needs: [setup_matrix]
    if: ${{ needs.setup_matrix.outputs.spec_matrix != '{}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.setup_matrix.outputs.spec_matrix)}}
    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet_version }}
      FACTER_GEM_VERSION: https://github.com/puppetlabs/facter#main
    steps:
      - run: |
          echo "SANITIZED_PUPPET_VERSION=$(echo '${{ matrix.puppet_version }}' | sed 's/~> //g')" >> $GITHUB_ENV
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby ${{ matrix.ruby_version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.ruby_version}}
          bundler-cache: true
      - name: Print bundle environment
        run: |
          echo ::group::bundler environment
            bundle env
          echo ::endgroup::
      - name: Run parallel_spec tests
        run: |-
          bundle exec rake parallel_spec
  # Tracks PE-45110 (Puppet 9 / Ruby 4 readiness). Not driven by matrix_from_metadata_v2
  # (its collection table has no puppet_maj_version: 9 entry) or metadata.json (which
  # intentionally still declares only puppet >= 8.0.0 < 9.0.0, since Puppet 9 support is
  # unvalidated).
  #
  # Puppet 9 still isn't on public rubygems, so this resolves puppet/facter from the
  # private puppetcore gem source (https://rubygems-puppetcore.puppet.com) instead --
  # see "How to consume the private puppetcore gems" on Confluence. The two upstream
  # blockers that used to make this job fail outright are both fixed now: puppet's
  # FrozenError from the old SSLv3 monkey patch under Ruby 4's frozen OpenSSL defaults
  # (PUP-12114), and facter's gemspec capping required_ruby_version at < 4.0 (now < 5.0).
  # Verified both locally (puppet-private@9.1.0 + facter-private@4.22.0 under Ruby 4.0.6)
  # and from this job's own Actions run: 111 examples, 0 failures, 6 pendings. Green, so
  # continue-on-error has been dropped -- this job now gives a real pass/fail signal.
  Ruby4Puppet9Experimental:
    name: 'Experimental: Puppet 9 / Ruby 4.0'
    if: ${{ github.repository_owner == 'puppetlabs' }}
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: ~> 9.0
      FACTER_GEM_VERSION: ~> 4.12
      PUPPET_FORGE_TOKEN: ${{ secrets.PUPPET_FORGE_API_TOKEN }}
      BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: forge-key:${{ secrets.PUPPET_FORGE_API_TOKEN }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 4.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Print bundle environment
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::
      - name: Run parallel_spec tests
        run: |-
          bundle exec rake parallel_spec
  Coverage:
    name: Code Coverage
    if: ${{ github.repository_owner == 'puppetlabs' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      # puppetlabs_spec_helper has no parallel_spec equivalent of the spec:simplecov task, so
      # coverage runs as its own single, non-parallelized job rather than joining the Spec
      # matrix above.
      - name: Run rspec with coverage
        run: bundle exec rake spec:simplecov
      - name: Upload Ruby code coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/coverage.xml
          language: Ruby
          label: code-coverage/rspec
      - name: Upload Puppet manifest coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/puppet-coverage.xml
          language: Puppet
          label: code-coverage/rspec-puppet
