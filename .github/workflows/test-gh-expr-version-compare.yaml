---
name: Scratch - GH expression version string comparison check
on:
  workflow_dispatch: {}
jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['2026.0.1', '2026.0.0', '2025.12.1', '2025.12.0', '2025.11.2', '2023.8.13', '2023.8.12', '2023.8.9', '2025.9.0', '2025.10.0']
    steps:
      - name: Echo comparison results for ${{ matrix.version }}
        run: |
          echo "version=${{ matrix.version }}"
          echo "version >= '2026.0.0' -> ${{ matrix.version >= '2026.0.0' }}"
          echo "version >= '2025.12.0' -> ${{ matrix.version >= '2025.12.0' }}"
          echo "version >= '2023.8.12' -> ${{ matrix.version >= '2023.8.12' }}"
          echo "version >= '2025.9.0' -> ${{ matrix.version >= '2025.9.0' }}"
          echo "version == '2023.8.13' -> ${{ matrix.version == '2023.8.13' }}"
