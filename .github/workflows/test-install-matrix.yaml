---
name: Install test matrix
on:
  pull_request:
    paths:
      - .github/workflows/**/*
      - spec/**/*
      - lib/**/*
      - tasks/**/*
      - functions/**/*
      - types/**/*
      - plans/**/*
      - hiera/**/*
      - manifests/**/*
      - templates/**/*
      - files/**/*
      - metadata.json
      - Rakefile
      - Gemfile
      - provision.yaml
      - .rspec
      - .rubocop.yml
      - .puppet-lint.rc
      - .fixtures.yml
    branches: [main]
  workflow_dispatch: {}
jobs:
  test-install:
    name: PE ${{ matrix.version }} ${{ matrix.architecture }} on ${{ matrix.image }}
    runs-on: ubuntu-latest
    env:
      BOLT_GEM: true
      BOLT_DISABLE_ANALYTICS: true
      LANG: en_US.UTF-8
    strategy:
      fail-fast: false
      matrix:
        architecture: [standard-with-dr, large, extra-large-with-dr]
        version: [2021.7.9, 2023.8.11, 2025.11.3]
        image: [almalinux-cloud/almalinux-8]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Print bundle environment
        if: ${{ github.repository_owner == 'puppetlabs' }}
        run: |
          echo ::group::info:bundler
            bundle env
          echo ::endgroup::
      - name: Provision test cluster
        timeout-minutes: 15
        run: |
          echo ::group::prepare
            mkdir -p $HOME/.ssh
            echo 'Host *'                      >  $HOME/.ssh/config
            echo '    ServerAliveInterval 150' >> $HOME/.ssh/config
            echo '    ServerAliveCountMax 2'   >> $HOME/.ssh/config
            bundle exec rake spec_prep
          echo ::endgroup::
          echo ::group::provision
            bundle exec bolt plan run peadm_spec::provision_test_cluster \
              --modulepath spec/fixtures/modules \
              provider=provision_service \
              image=${{ matrix.image }} \
              architecture=${{ matrix.architecture }} \
              --log-level trace
          echo ::endgroup::
          echo ::group::info:request
            cat request.json || true; echo
          echo ::endgroup::
          echo ::group::info:inventory
            sed -e 's/password: .*/password: "[redacted]"/' < spec/fixtures/litmus_inventory.yaml || true
          echo ::endgroup::
      # PE-47523: a unique console password per run, so the steps after the
      # install can search Bolt's output and debug log for it. It uses only
      # letters, digits and - . @, which Bolt never shell-escapes, so a leak
      # can't hide in an escaped form; PE's complexity rules want the special
      # characters, and the PE installer can't take a $.
      - name: Generate a canary console password
        run: |
          canary="Canary-$(openssl rand -hex 12).Pw1@"
          echo "::add-mask::${canary}"
          echo "CONSOLE_PASSWORD_CANARY=${canary}" >> "$GITHUB_ENV"
      - name: Install PE on test cluster
        id: install
        timeout-minutes: 120
        run: |
          set -o pipefail
          bundle exec bolt plan run peadm_spec::install_test_cluster \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            architecture=${{ matrix.architecture }} \
            version=${{ matrix.version }} \
            console_password="$CONSOLE_PASSWORD_CANARY" 2>&1 | tee bolt-install-output.log
      # Also runs after a failed install: error paths are where a secret is
      # most likely to surface.
      - name: Check the console password didn't leak
        if: ${{ !cancelled() && steps.install.outcome != 'skipped' }}
        run: |
          : "${CONSOLE_PASSWORD_CANARY:?is not set}"
          # Bolt finds no bolt-project.yaml in the checkout root or its
          # parents, so it uses its default project, and each run overwrites
          # that project's debug log: check it before any other Bolt run.
          debug_log="$HOME/.puppetlabs/bolt/bolt-debug.log"
          for log in "$debug_log" bolt-install-output.log; do
            if [ ! -s "$log" ]; then
              echo "::error::${log} is missing or empty"
              exit 1
            fi
          done
          # Positive control, once the install has got that far: the log
          # records task arguments, with rbac_token's password masked.
          if [ "${{ steps.install.outcome }}" = success ] &&
            ! grep -F 'Running task peadm::rbac_token with' "$debug_log" | grep -qF '"password":"Sensitive [value redacted]"'; then
            echo "::error::bolt-debug.log has no masked password argument for peadm::rbac_token"
            exit 1
          fi
          rc=0
          leaks=$(grep -nF -- "$CONSOLE_PASSWORD_CANARY" "$debug_log" bolt-install-output.log) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::The console password appears in Bolt's output or debug log:"
            printf '%s\n' "${leaks//"$CONSOLE_PASSWORD_CANARY"/<console password>}" | cut -c1-400
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::grep failed with exit code ${rc}"
            exit 1
          fi
      - name: Check the bootstrap pe.conf was removed
        run: |
          bundle exec bolt plan run peadm_spec::verify_no_bootstrap_pe_conf \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules
      - name: Tear down test cluster
        if: ${{ always() }}
        continue-on-error: true
        run: |-
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            echo ::group::tear_down
              bundle exec rake 'litmus:tear_down'
            echo ::endgroup::
            echo ::group::info:request
              cat request.json || true; echo
            echo ::endgroup::
          fi
