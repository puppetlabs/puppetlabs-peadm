---
name: Install fips test matrix
on:
  pull_request:
    paths:
      - .github/workflows/**/*
      - spec/**/*
      - lib/**/*
      - tasks/**/*
      - functions/**/*
      - types/**/*
      - plans/**/*
      - hiera/**/*
      - manifests/**/*
      - templates/**/*
      - files/**/*
      - metadata.json
      - Rakefile
      - Gemfile
      - provision.yaml
      - .rspec
      - .rubocop.yml
      - .puppet-lint.rc
      - .fixtures.yml
    branches: [main]
  workflow_dispatch: {}
jobs:
  test-install:
    name: PE ${{ matrix.version }} ${{ matrix.architecture }} on ${{ matrix.image }}
      with fips ${{ matrix.fips }}
    runs-on: ubuntu-latest
    env:
      BOLT_GEM: true
      BOLT_DISABLE_ANALYTICS: true
      LANG: en_US.UTF-8
      # PE 2026.0.0 jobs hit CI VM OOM (Cannot allocate memory - fork(2))
      # on the default provision_service VM size. Request a bigger VM via
      # provision#301 (provision >= v3.1.0), scoped to only the 2026.0.0
      # matrix combinations -- empty string for everything else leaves the
      # task's own default untouched (see provision_service.rb).
      #
      # Also scoped to 3 specific FIPS/DR combinations that were failing
      # with connection-level errors (SSH IOError / orchestrator SSL drop,
      # or "certificate revoked" mid-purge) during long pg_basebackup-heavy
      # replica provisioning. Tested on a separate scratch branch
      # (test/fips-dr-bigger-vm-experiment) -- all 3 passed on n2-standard-4:
      #   - PE 2023.8.12 extra-large-with-dr (run 40311093235/job 121532181078)
      #   - PE 2025.12.0 standard-with-dr (run 40311093235/job 121532181414)
      #   - PE 2025.12.0 extra-large-with-dr (run 40322952862/job 121572291837)
      # Evidence this fixes the root cause (vs. masking it) is supportive
      # but not conclusive -- one passing run per combo, not a repeated
      # confirmation. Tracked in PE-47827.
      PROVISION_MACHINE_TYPE: ${{ (matrix.version == '2026.0.0' || (matrix.version == '2023.8.12' && matrix.architecture == 'extra-large-with-dr') || (matrix.version == '2025.12.0' && matrix.architecture == 'standard-with-dr') || (matrix.version == '2025.12.0' && matrix.architecture == 'extra-large-with-dr')) && 'n2-standard-4' || '' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [standard-with-dr, large, extra-large-with-dr]
        version: [2023.8.12, 2025.12.0, 2026.0.0]
        image: [rhel-8]
        fips: [enable]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Print bundle environment
        if: ${{ github.repository_owner == 'puppetlabs' }}
        run: |
          echo ::group::info:bundler
            bundle env
          echo ::endgroup::
      - name: Provision test cluster
        timeout-minutes: 15
        run: |
          echo ::group::prepare
            mkdir -p $HOME/.ssh
            echo 'Host *'                      >  $HOME/.ssh/config
            echo '    ServerAliveInterval 150' >> $HOME/.ssh/config
            echo '    ServerAliveCountMax 2'   >> $HOME/.ssh/config
            bundle exec rake spec_prep
          echo ::endgroup::
          echo ::group::provision
            bundle exec bolt plan run peadm_spec::provision_test_cluster \
              --modulepath spec/fixtures/modules \
              provider=provision_service \
              image=${{ matrix.image }} \
              architecture=${{ matrix.architecture }}
          echo ::endgroup::
          echo ::group::info:request
            cat request.json || true; echo
          echo ::endgroup::
          echo ::group::info:inventory
            sed -e 's/password: .*/password: "[redacted]"/' < spec/fixtures/litmus_inventory.yaml || true
          echo ::endgroup::
      - name: Install PE on test cluster
        timeout-minutes: 120
        run: |
          bundle exec bolt plan run peadm_spec::install_test_cluster \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            architecture=${{ matrix.architecture }} \
            version=${{ matrix.version }} \
            fips=${{ matrix.fips }} \
            console_password=${{ secrets.CONSOLE_PASSWORD }}
      - name: Tear down test cluster
        if: ${{ always() }}
        continue-on-error: true
        run: |-
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            echo ::group::tear_down
              bundle exec rake 'litmus:tear_down'
            echo ::endgroup::
            echo ::group::info:request
              cat request.json || true; echo
            echo ::endgroup::
          fi
