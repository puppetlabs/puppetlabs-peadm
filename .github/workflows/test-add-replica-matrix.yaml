---
name: Add replica matrix
on:
  pull_request:
    paths:
      - .github/workflows/**/*
      - spec/**/*
      - lib/**/*
      - tasks/**/*
      - functions/**/*
      - types/**/*
      - plans/**/*
      - hiera/**/*
      - manifests/**/*
      - templates/**/*
      - files/**/*
      - metadata.json
      - Rakefile
      - Gemfile
      - provision.yaml
      - .rspec
      - .rubocop.yml
      - .puppet-lint.rc
      - .fixtures.yml
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          TEMPORARY, validation-only: 'matrix' runs the full add_replica matrix
          below; 'smoke' instead runs a single-VM provision+verify+teardown
          with no PE install, to check machine_type in isolation.
        required: false
        default: matrix
        type: choice
        options: [matrix, smoke]
jobs:
  test-add-replica:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'smoke' }}
    name: PE ${{ matrix.version }} ${{ matrix.architecture }} on ${{ matrix.image }}
    runs-on: ubuntu-latest
    env:
      BOLT_GEM: true
      BOLT_DISABLE_ANALYTICS: true
      LANG: en_US.UTF-8
      # TEMPORARY, validation-only (DO NOT MERGE): requests a bigger VM via the
      # provision#301 / provision_service#445 branches to check whether that
      # resolves the "Cannot allocate memory - fork(2)" OOM errors seen on
      # PE 2026.0.0 jobs in #718. SERVICE_URL points at provision_service's
      # ephemeral per-PR branch deployment, not production.
      SERVICE_URL: "https://facade-per-job-machine-type-1079112402178.europe-west1.run.app/v1/provision"
      PROVISION_MACHINE_TYPE: n2-standard-4
    strategy:
      fail-fast: false
      matrix:
        architecture: [standard, standard-with-dr, large, extra-large]
        # TEMPORARY, validation-only: narrowed to 2026.0.0, the only version that OOMs.
        version: [2026.0.0]
        image: [almalinux-cloud/almalinux-8]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Print bundle environment
        if: ${{ github.repository_owner == 'puppetlabs' }}
        run: |
          echo ::group::info:bundler
            bundle env
          echo ::endgroup::
      - name: Provision test cluster (specified architecture and a spare replica)
        timeout-minutes: 15
        run: |
          echo ::group::prepare
            mkdir -p $HOME/.ssh
            echo 'Host *'                      >  $HOME/.ssh/config
            echo '    ServerAliveInterval 150' >> $HOME/.ssh/config
            echo '    ServerAliveCountMax 2'   >> $HOME/.ssh/config
            bundle exec rake spec_prep
          echo ::endgroup::
          echo ::group::provision
            bundle exec bolt plan run peadm_spec::provision_test_cluster \
              --modulepath spec/fixtures/modules \
              provider=provision_service \
              image=${{ matrix.image }} \
              architecture=${{ matrix.architecture }}-and-spare-replica
          echo ::endgroup::
          echo ::group::info:request
            cat request.json || true; echo
          echo ::endgroup::
          echo ::group::info:inventory
            sed -e 's/password: .*/password: "[redacted]"/' < spec/fixtures/litmus_inventory.yaml || true
          echo ::endgroup::
      - name: Install PE on test cluster
        timeout-minutes: 120
        run: |
          bundle exec bolt plan run peadm_spec::install_test_cluster \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            architecture=${{ matrix.architecture }} \
            version=${{ matrix.version }} \
            console_password=${{ secrets.CONSOLE_PASSWORD }} \
            code_manager_auto_configure=true
      - name: Run add_replica plan
        timeout-minutes: 60
        run: |
          bundle exec bolt plan run peadm_spec::add_replica -v \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules \
            --stream
      - name: Verify that replica was added
        timeout-minutes: 10
        run: |
          bundle exec bolt plan run peadm_spec::verify_replica -v \
            --inventoryfile spec/fixtures/litmus_inventory.yaml \
            --modulepath spec/fixtures/modules
      - name: Tear down test cluster
        if: ${{ always() }}
        continue-on-error: true
        run: |-
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            echo ::group::tear_down
              bundle exec rake 'litmus:tear_down'
            echo ::endgroup::
            echo ::group::info:request
              cat request.json || true; echo
            echo ::endgroup::
          fi

  # TEMPORARY, validation-only (DO NOT MERGE): isolates "does machine_type
  # work at all" from "does a bigger VM fix the PE 2026.0.0 OOM" (the matrix
  # job above). Dispatch with mode=smoke to run only this job.
  smoke-test-machine-type:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'smoke' }}
    name: Smoke test - verify machine_type is honored (no PE install)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOLT_GEM: true
      BOLT_DISABLE_ANALYTICS: true
      LANG: en_US.UTF-8
      SERVICE_URL: "https://facade-per-job-machine-type-1079112402178.europe-west1.run.app/v1/provision"
      PROVISION_MACHINE_TYPE: n2-standard-4
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Prepare fixtures
        run: |
          mkdir -p $HOME/.ssh
          echo 'Host *'                      >  $HOME/.ssh/config
          echo '    ServerAliveInterval 150' >> $HOME/.ssh/config
          echo '    ServerAliveCountMax 2'   >> $HOME/.ssh/config
          bundle exec rake spec_prep
      - name: Provision a single VM with machine_type set
        timeout-minutes: 10
        run: |
          echo ::group::provision
            bundle exec bolt task run provision::provision_service \
              --targets localhost \
              --modulepath spec/fixtures/modules \
              action=provision \
              platform=almalinux-cloud/almalinux-8
          echo ::endgroup::
          echo ::group::info:request
            cat request.json || true; echo
          echo ::endgroup::
          echo ::group::info:inventory
            sed -e 's/password: .*/password: "[redacted]"/' < spec/fixtures/litmus_inventory.yaml || true
          echo ::endgroup::
      - name: Confirm the actual GCP machine type
        timeout-minutes: 5
        run: |
          # The provision request returns as soon as Terraform reports the VM created,
          # not once sshd is actually reachable, so retry rather than fail on the
          # inevitable early "Connection refused" while cloud-init is still booting.
          for attempt in $(seq 1 15); do
            if bundle exec bolt command run \
              'echo "machine-type: $(curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/machine-type")"' \
              --targets all \
              --inventoryfile spec/fixtures/litmus_inventory.yaml; then
              exit 0
            fi
            echo "SSH not ready yet (attempt ${attempt}/15), retrying in 15s..."
            sleep 15
          done
          exit 1
      - name: Tear down
        if: ${{ always() }}
        continue-on-error: true
        run: |-
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            echo ::group::tear_down
              bundle exec rake 'litmus:tear_down'
            echo ::endgroup::
          fi
